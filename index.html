<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Echo">
<meta name="theme-color" content="#07070b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Echo</title>
<style>
:root{--bg:#07070b;--s1:#121218;--s2:#1b1a23;--line:rgba(255,255,255,.08);--tx:#f4f4f7;--mut:#9a9aa8;--acc:#a78bfa;--grad:linear-gradient(135deg,#8b5cf6,#ec4899);--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);--ease:cubic-bezier(.32,.72,0,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font:15px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{min-height:100vh;padding-bottom:calc(150px + var(--sab));-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
img{display:block}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.f{fill:currentColor;stroke:none}
.sbar{position:fixed;top:0;left:0;right:0;height:var(--sat);background:var(--bg);z-index:30}
.view{padding:calc(var(--sat) + 14px) 16px 0;max-width:760px;margin:0 auto}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0}
.hello{color:var(--mut);font-size:14px;font-weight:500;margin-bottom:2px}
h1{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
h2{font-size:20px;font-weight:700;letter-spacing:-.02em;margin:26px 0 12px}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;flex:none;transition:transform .15s}
.ib:active{transform:scale(.9);background:rgba(255,255,255,.08)}
.round{background:var(--s2)}
.syncing .sync .ic{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.syncline{color:var(--mut);font-size:13px;min-height:18px;margin-bottom:8px}
.hero{background:radial-gradient(120% 140% at 0% 0%,rgba(139,92,246,.35),transparent 60%),radial-gradient(120% 140% at 100% 100%,rgba(236,72,153,.28),transparent 60%),var(--s1);border:1px solid var(--line);border-radius:22px;padding:22px;margin:6px 0 18px}
.hero-t{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
.hero p{color:var(--mut);margin-bottom:16px}
.liked{display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;background:var(--s1);border:1px solid var(--line);cursor:pointer}
.liked:active{transform:scale(.99)}
.liked-ic{width:56px;height:56px;border-radius:12px;background:var(--grad);display:grid;place-items:center;box-shadow:0 8px 24px rgba(139,92,246,.35)}
.liked-ic .ic{width:26px;height:26px;color:#fff}
.liked .grow{flex:1}
.liked-t{font-weight:700;font-size:17px}
.t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.pcard{cursor:pointer;min-width:0}
.pcard:active{transform:scale(.97)}
.pcard .cover{width:100%;aspect-ratio:1;border-radius:14px;object-fit:cover;background:var(--s2);margin-bottom:8px}
.noart{display:grid;place-items:center;background:linear-gradient(135deg,#25242f,#15151b);color:#5b5a70}
.hscroll{display:flex;gap:14px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scroll-snap-type:x mandatory;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.rcard{width:128px;flex:none;scroll-snap-align:start;cursor:pointer}
.rc-art{width:128px;height:128px;border-radius:12px;object-fit:cover;margin-bottom:8px}
.row{display:flex;align-items:center;gap:12px;padding:7px 4px;margin:0 -4px;border-radius:10px;cursor:pointer}
.row:active{background:rgba(255,255,255,.05)}
.ra{width:48px;height:48px;border-radius:8px;object-fit:cover;flex:none}
.rt{flex:1;min-width:0}
.rd{color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums}
.row.on .t1{color:var(--acc)}
.bars{display:none;align-items:flex-end;gap:2px;height:11px;margin-right:6px;vertical-align:-1px}
.bars i{width:3px;background:var(--acc);border-radius:1px;animation:bar .9s ease-in-out infinite alternate}
.bars i:nth-child(2){animation-delay:-.3s}.bars i:nth-child(3){animation-delay:-.6s}
@keyframes bar{from{height:3px}to{height:11px}}
body:not(.is-playing) .bars i{animation-play-state:paused}
.row.on .bars{display:inline-flex}
.bar{display:flex;justify-content:space-between;margin:0 -8px 4px}
.phead{text-align:center;margin-bottom:14px}
.pcover{width:min(62vw,240px);aspect-ratio:1;margin:0 auto 18px;border-radius:18px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.pcover .cover{width:100%;height:100%;object-fit:cover}
.lcover{width:100%;height:100%;background:var(--grad);display:grid;place-items:center}
.lcover .ic{width:38%;height:38%;color:#fff}
.phead h1{font-size:28px}
.pmeta{color:var(--mut);font-size:14px;margin-top:6px}
.pbtns{display:flex;gap:10px;justify-content:center;margin-top:16px}
.btn-play,.btn-sec{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 22px;border-radius:999px;font-weight:700;transition:transform .15s}
.btn-play:active,.btn-sec:active{transform:scale(.96)}
.btn-play{background:var(--grad);color:#fff;box-shadow:0 10px 30px rgba(139,92,246,.35)}
.btn-sec{background:var(--s2);border:1px solid var(--line)}
.btn-play .ic,.btn-sec .ic{width:18px;height:18px}
.empty,.loading{color:var(--mut);text-align:center;padding:30px 10px}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin-right:8px;vertical-align:-3px}
.sbox{position:relative;margin:12px 0 8px}
.sbox .ic{position:absolute;left:14px;top:14px;color:var(--mut);width:18px;height:18px}
.sbox input{padding-left:42px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{padding:8px 14px;border-radius:999px;background:var(--s2);border:1px solid var(--line);font-size:13px;font-weight:600}
input.field{width:100%;height:46px;border-radius:12px;background:var(--s2);border:1px solid var(--line);padding:0 14px;font-size:16px;outline:none}
input.field:focus{border-color:rgba(167,139,250,.7)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:18px;margin:14px 0;display:flex;flex-direction:column;gap:14px}
.card-h{font-weight:800;font-size:18px}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mut);font-weight:600}
.copy{display:flex;gap:8px;align-items:center;background:var(--s2);border-radius:12px;padding:6px 6px 6px 12px;border:1px solid var(--line)}
.copy code{flex:1;font-size:13px;color:var(--tx);word-break:break-all;font-family:ui-monospace,Menlo,monospace}
.copy button{background:rgba(255,255,255,.1);border-radius:8px;padding:8px 12px;font-weight:600}
.status{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--mut)}
.status::before{content:'';width:8px;height:8px;border-radius:50%;background:#71717a}
.status.ok{color:#86efac}.status.ok::before{background:#22c55e;box-shadow:0 0 10px #22c55e}
.hint{color:var(--mut);font-size:13px}
.row2{display:flex;gap:10px;flex-wrap:wrap}
.file{cursor:pointer;align-self:flex-start}
.seg{display:flex;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;height:40px;border-radius:9px;font-weight:700;color:var(--mut)}
.seg button.on{background:var(--grad);color:#fff}
a.mi{color:inherit;text-decoration:none}
details summary{font-weight:800;font-size:18px;cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
details ol{padding-left:20px;margin-top:12px;color:var(--mut);display:flex;flex-direction:column;gap:10px}
details b{color:var(--tx)}
details a{color:var(--acc)}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:space-around;padding:8px 0 calc(8px + var(--sab));background:rgba(7,7,11,.84);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--mut);width:80px}
.tab.on{color:var(--tx)}
/* mini player */
.mini{position:fixed;left:10px;right:10px;bottom:calc(64px + var(--sab));z-index:40;height:60px;max-width:740px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:0 6px 0 8px;border-radius:16px;background:rgba(34,31,46,.88);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.08);box-shadow:0 10px 40px rgba(0,0,0,.5);overflow:hidden;transition:transform .3s,opacity .3s;cursor:pointer}
.mini.hidden{transform:translateY(20px);opacity:0;pointer-events:none}
.mini-art{width:64px;height:36px;border-radius:6px;overflow:hidden;flex:none;background:var(--s2)}
.mini-art img{width:100%;height:100%;object-fit:cover}
.mini-t{flex:1;min-width:0}
#miniLike.on,#npLike.on{color:#f472b6}
.mini-prog{position:absolute;left:12px;right:12px;bottom:0;height:2px;background:rgba(255,255,255,.1);border-radius:2px}
.mini-prog i{display:block;height:100%;background:var(--grad);width:0}
/* now playing */
.np{position:fixed;inset:0;z-index:50;background:#0c0b12;transform:translateY(100%);visibility:hidden;transition:transform .42s var(--ease),visibility 0s linear .42s;overflow:hidden}
.np-open .np{transform:none;visibility:visible;transition:transform .42s var(--ease),visibility 0s}
.np-bg{position:absolute;inset:-10%}
.np-bg img{width:100%;height:100%;object-fit:cover;filter:blur(60px) saturate(1.5);opacity:.55;transform:scale(1.2)}
.np-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,11,18,.15),rgba(12,11,18,.8) 65%,#0c0b12)}
.np-in{position:relative;height:100%;display:flex;flex-direction:column;padding:calc(var(--sat) + 6px) 22px calc(var(--sab) + 18px);max-width:600px;margin:0 auto}
.np-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.np-ctx{text-align:center;min-width:0;flex:1}
.np-ctx small{display:block;font-size:10px;letter-spacing:.14em;color:var(--mut);font-weight:700}
.np-ctx b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-main{flex:1;display:flex;flex-direction:column;justify-content:center}
.np-art{width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;position:relative;background:#000;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.np-art .bgi{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(24px);opacity:.6;transform:scale(1.2)}
.np-art .fgi{position:absolute;height:84%;aspect-ratio:1;top:8%;left:50%;transform:translateX(-50%);border-radius:8px;object-fit:cover;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.np-status{text-align:center;color:var(--mut);font-size:13px;height:20px;margin:12px 0 4px}
.np-meta{display:flex;align-items:center;gap:12px;margin-top:6px}
.np-meta .grow{flex:1;min-width:0}
.np-title{font-size:24px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-artist{color:var(--mut);font-size:17px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{margin-top:18px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;--p:0%;outline:none}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,#fff var(--p),rgba(255,255,255,.18) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;margin-top:-5px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:linear-gradient(90deg,#fff var(--p),rgba(255,255,255,.18) var(--p))}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:0}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.ctrls{display:flex;align-items:center;justify-content:space-between;margin:14px 0 22px}
.ctrls .ib .ic{width:28px;height:28px}
.ctrls .side{color:var(--mut);position:relative}
.ctrls .side .ic{width:22px;height:22px}
.ctrls .side.on{color:var(--acc)}
.ctrls .side.on::after{content:'';position:absolute;bottom:2px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--acc)}
.bigplay{width:72px!important;height:72px!important;background:#fff;color:#0c0b12;box-shadow:0 10px 40px rgba(255,255,255,.15)}
.bigplay .ic{width:30px!important;height:30px!important}
.np-bottom{display:flex;justify-content:space-between}
.pill{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.08);font-size:13px;font-weight:600}
.pill .ic{width:16px;height:16px}
/* youtube player (moves between mini player and now playing) */
#ytw{position:fixed;left:0;top:0;width:356px;height:200px;transform-origin:0 0;overflow:hidden;z-index:42;background:#000;transition:transform .42s var(--ease),border-radius .42s var(--ease);will-change:transform;-webkit-mask-image:-webkit-radial-gradient(white,black)}
#ytw.off{display:none}
#ytw.mini-mode{pointer-events:none}
#ytw iframe{width:356px;height:200px;display:block;border:0}
/* panel */
.ov{position:fixed;inset:0;z-index:69;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .3s}
.panel-open .ov{opacity:1;pointer-events:auto}
.panel{position:fixed;left:0;right:0;bottom:0;z-index:70;max-height:82vh;max-width:640px;margin:0 auto;display:flex;flex-direction:column;background:#17161f;border-radius:22px 22px 0 0;border-top:1px solid var(--line);transform:translateY(105%);transition:transform .38s var(--ease);padding:8px 16px calc(16px + var(--sab))}
.panel-open .panel{transform:none}
.grab{width:36px;height:5px;border-radius:3px;background:rgba(255,255,255,.2);margin:0 auto 10px;flex:none}
.panel-h{display:flex;align-items:center;gap:12px;padding:4px 0 12px;border-bottom:1px solid var(--line);font-weight:700;font-size:17px;min-width:0}
.panel-h>div{min-width:0}
.panel-b{overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:6px}
.mi{display:flex;align-items:center;gap:14px;width:100%;padding:14px 4px;font-size:16px;text-align:left;border-radius:10px}
.mi:active{background:rgba(255,255,255,.05)}
.alt{display:flex;gap:12px;align-items:center;padding:8px;border-radius:12px;cursor:pointer;min-width:0}
.alt>div{min-width:0}
.alt img{width:104px;aspect-ratio:16/9;border-radius:8px;object-fit:cover;flex:none}
.alt.on{background:rgba(139,92,246,.2)}
.paste{display:flex;gap:8px;margin-top:12px}
.paste .btn-sec{height:46px}
.qsec{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin:14px 0 4px}
.toast{position:fixed;left:50%;top:calc(var(--sat) + 12px);transform:translate(-50%,-30px);opacity:0;z-index:90;background:rgba(40,38,52,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:12px 18px;border-radius:14px;font-size:14px;font-weight:500;width:max-content;max-width:calc(100% - 32px);box-shadow:0 10px 40px rgba(0,0,0,.5);transition:.3s;pointer-events:none;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="sbar"></div>
<main id="view" class="view"></main>

<div id="mini" class="mini hidden" data-act="openNP">
  <div id="miniArt" class="mini-art"></div>
  <div class="mini-t"><div id="miniTitle" class="t1"></div><div id="miniArtist" class="t2"></div></div>
  <button class="ib" id="miniLike" data-act="like"></button>
  <button class="ib" id="miniPlay" data-act="toggle"></button>
  <div class="mini-prog"><i id="miniBar"></i></div>
</div>

<nav class="tabs" id="tabs">
  <button class="tab" data-act="tab" data-v="home" id="tab-home"></button>
  <button class="tab" data-act="tab" data-v="search" id="tab-search"></button>
  <button class="tab" data-act="tab" data-v="settings" id="tab-settings"></button>
</nav>

<div id="np" class="np">
  <div class="np-bg"><img id="npBg" alt=""></div>
  <div class="np-in">
    <div class="np-top">
      <button class="ib" data-act="closeNP" id="npClose"></button>
      <div class="np-ctx"><small>PLAYING FROM</small><b id="npCtx"></b></div>
      <button class="ib" data-act="npMenu" id="npMore"></button>
    </div>
    <div class="np-main">
      <div id="npArt" class="np-art"></div>
      <div id="npStatus" class="np-status"></div>
      <div class="np-meta">
        <div class="grow"><div id="npTitle" class="np-title"></div><div id="npArtist" class="np-artist"></div></div>
        <button class="ib" id="npLike" data-act="like"></button>
      </div>
      <div class="prog">
        <input type="range" id="seek" min="0" max="1000" value="0">
        <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
      </div>
      <div class="ctrls">
        <button class="ib side" id="bShuf" data-act="shuf"></button>
        <button class="ib" id="bPrev" data-act="prev"></button>
        <button class="ib bigplay" id="npPlay" data-act="toggle"></button>
        <button class="ib" id="bNext" data-act="next"></button>
        <button class="ib side" id="bRep" data-act="rep"></button>
      </div>
      <div class="np-bottom">
        <button class="pill" data-act="fix" id="bFix"></button>
        <button class="pill" data-act="queue" id="bQueue"></button>
      </div>
    </div>
  </div>
</div>

<div id="ytw" class="off"><div id="yt"></div></div>

<div id="ov" class="ov" data-act="closePanel"></div>
<div id="panel" class="panel"><div class="grab"></div><div id="panelH" class="panel-h"></div><div id="panelB" class="panel-b"></div></div>
<div id="toast" class="toast"></div>

<script>
// Shows any startup error on screen instead of a blank page.
window.addEventListener('error', function (e) {
  var v = document.getElementById('view');
  if (v && !v.innerHTML.trim()) v.innerHTML = '<div style="padding:40px 8px;color:#f87171;font-size:14px">Echo couldn’t start:<br><br>' + String(e.message).replace(/</g, '&lt;') + '</div>';
});
</script>
<script>
'use strict';
/* Echo — your Spotify library, played through YouTube's official player. */

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const LS = {
  get(k, d) { try { const v = localStorage.getItem('echo.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v, replacer) { try { localStorage.setItem('echo.' + k, JSON.stringify(v, replacer)); return true; } catch (e) { console.warn(e); return false; } }
};
const fmt = ms => { const s = Math.max(0, Math.floor((ms || 0) / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const durLong = ms => { const m = Math.round(ms / 60000), h = Math.floor(m / 60); return h ? `${h} hr ${m % 60} min` : `${m} min`; };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const decode = s => { const e = document.createElement('textarea'); e.innerHTML = s; return e.value; };
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

// ---------- Spotify ----------
async function spLogin() {
  if (!S.settings.cid) { toast('Paste your Spotify Client ID first'); return; }
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(48)));
  LS.set('pkce', verifier);
  const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  location.href = 'https://accounts.spotify.com/authorize?' + new URLSearchParams({
    client_id: S.settings.cid, response_type: 'code', redirect_uri: REDIRECT,
    code_challenge_method: 'S256', code_challenge: challenge, scope: SCOPES
  });
}
async function tokenRequest(body) {
  const r = await fetch('https://accounts.spotify.com/api/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error_description || j.error || 'Spotify login failed');
  S.auth = { access: j.access_token, refresh: j.refresh_token || (S.auth && S.auth.refresh), exp: Date.now() + j.expires_in * 1000 };
  LS.set('auth', S.auth);
}
async function handleRedirect() {
  const p = new URLSearchParams(location.search);
  if (!p.has('code') && !p.has('error')) return;
  history.replaceState(null, '', REDIRECT);
  if (p.get('error')) { toast('Spotify: ' + p.get('error')); return; }
  const ver = LS.get('pkce', null);
  if (!ver) { toast('Login timed out — try again'); return; }
  try {
    await tokenRequest({ grant_type: 'authorization_code', code: p.get('code'), redirect_uri: REDIRECT, client_id: S.settings.cid, code_verifier: ver });
    LS.set('pkce', null); toast('Connected to Spotify'); syncAll();
  } catch (e) { toast('Spotify login failed: ' + e.message); }
}
async function getToken() {
  if (!S.auth) return null;
  if (Date.now() < S.auth.exp - 60000) return S.auth.access;
  try { await tokenRequest({ grant_type: 'refresh_token', refresh_token: S.auth.refresh, client_id: S.settings.cid }); }
  catch (e) { S.auth = null; LS.set('auth', null); throw new Error('Spotify session expired — reconnect in Settings'); }
  return S.auth.access;
}
async function sp(path, opt = {}, retry = true) {

  const r = await fetch(url, { ...opt, headers: { Authorization: 'Bearer ' + tok, ...(opt.headers || {}) } });
  if (r.status === 401 && retry) { S.auth.exp = 0; return sp(path, opt, false); }
  if (r.status === 429) { await sleep((+(r.headers.get('Retry-After')) || 3) * 1000); return sp(path, opt, retry); }
  if (!r.ok) { let m = 'error ' + r.status; try { const j = await r.json(); m = (j.error && j.error.message) || m; } catch (e) {} const err = new Error('Spotify: ' + m); err.status = r.status; throw err; }
  const txt = await r.text(); return txt ? JSON.parse(txt) : null;
}
async function paged(path, each, prog) {
  let url = path, n = 0;
  while (url) { const j = await sp(url); for (const it of (j.items || [])) { each(it); n++; } if (prog) prog(n); url = j.next; }
}
function pickImg(imgs) { if (!imgs || !imgs.length) return ''; const m = imgs.find(i => i.width && i.width <= 320 && i.width >= 200); return (m || imgs[imgs.length > 1 ? 1 : 0]).url; }

  if (!t || !t.name || (t.type && t.type !== 'track')) return null;
  const artists = (t.artists || []).map(a => a.name).filter(Boolean).join(', ');
  return { id: t.id || ('x:' + (t.name + '|' + artists).toLowerCase()), name: t.name, artists, album: (t.album && t.album.name) || '', img: pickImg(t.album && t.album.images), dur: t.duration_ms || 0 };

  const add = it => { const t = normTrack(it && (it.track || it.item)); if (t) out.push(t); };
  try { await paged(`/playlists/${id}/tracks?limit=100`, add); }
  catch (e) { if (![403, 404, 410].includes(e.status)) throw e; out.length = 0; await paged(`/playlists/${id}/items?limit=100`, add); }

}
async function syncAll() {
  if (S.syncing) return;
  S.syncing = true; setSync('Syncing…');
  try {
    const me = await sp('/me'); S.lib.user = me.display_name || me.id;
    const liked = [];
    await paged('/me/tracks?limit=50', it => { const t = normTrack(it.track || it.item); if (t) liked.push(t); }, n => setSync(`Liked songs… ${n}`));
    S.lib.liked = liked;
    const pls = [];
    await paged('/me/playlists?limit=50', p => { if (p) pls.push({ id: p.id, name: p.name, img: (p.images && p.images[0] && p.images[0].url) || '', owner: (p.owner && p.owner.display_name) || '', total: ((p.tracks || p.items || {}).total) || 0, snap: p.snapshot_id, tracks: null }); });
    const old = {}; (S.lib.playlists || []).forEach(p => old[p.id] = p);

    S.lib.playlists = [...pls, ...(S.lib.playlists || []).filter(p => p.imported)];
    saveLib(); render();
    for (let i = 0; i < pls.length; i++) {

    }

}

// ---------- YouTube matching ----------
async function ytApi(ep, params) {
  const r = await fetch('https://www.googleapis.com/youtube/v3/' + ep + '?' + new URLSearchParams({ ...params, key: S.settings.yt }));
  const j = await r.json().catch(() => ({}));
  if (!r.ok) {
    const reason = (j.error && j.error.errors && j.error.errors[0] && j.error.errors[0].reason) || '';
    if (reason === 'quotaExceeded') throw new Error('YouTube daily limit reached (about 100 new songs a day). Songs you played before still work. It resets overnight.');
    throw new Error('YouTube: ' + ((j.error && j.error.message) || r.status).toString().replace(/<[^>]+>/g, ''));
  }
  return j;
}
const isoDur = s => { const m = /PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/.exec(s || ''); return m ? (+m[1] || 0) * 3600 + (+m[2] || 0) * 60 + (+m[3] || 0) : 0; };
const BAD = ['live', 'cover', 'remix', 'karaoke', 'instrumental', 'slowed', 'reverb', 'sped up', 'nightcore', '8d', 'reaction', 'tutorial', 'lesson', '1 hour', '10 hours', 'loop', 'concert'].map(w => [w, new RegExp('\\b' + w + '\\b', 'i')]);
async function findMatch(t) {
  if (!S.settings.yt) throw new Error('Add your YouTube API key in Settings first');
  const artist = (t.artists || '').split(',')[0].trim();
  const sr = await ytApi('search', { part: 'snippet', type: 'video', maxResults: 8, videoEmbeddable: 'true', q: `${artist} ${t.name}`.trim() });
  const ids = (sr.items || []).map(i => i.id && i.id.videoId).filter(Boolean);
  if (!ids.length) throw new Error(`No YouTube results for “${t.name}”`);
  const vr = await ytApi('videos', { part: 'contentDetails,snippet,status', id: ids.join(',') });
  const name = t.name.toLowerCase(), want = (t.dur || 0) / 1000, al = artist.toLowerCase();
  const alts = (vr.items || []).filter(v => !v.status || v.status.embeddable !== false).map(v => {
    const title = decode(v.snippet.title), ch = v.snippet.channelTitle || '', dur = isoDur(v.contentDetails.duration), tl = title.toLowerCase();
    let sc = ids.indexOf(v.id) * 3;
    if (want && dur) sc += Math.min(Math.abs(dur - want), 180) / 3;
    for (const [w, re] of BAD) if (re.test(tl) && !name.includes(w)) sc += 30;
    if (/ - topic$/i.test(ch)) sc -= 10;
    if (tl.includes('official audio')) sc -= 6;
    if (al && !(tl + ' ' + ch.toLowerCase()).includes(al)) sc += 12;
    return { id: v.id, title: title.slice(0, 90), ch, dur, sc };
  }).sort((a, b) => a.sc - b.sc).slice(0, 5).map(a => ({ id: a.id, title: a.title, ch: a.ch, dur: a.dur }));
  if (!alts.length) throw new Error(`No playable YouTube version of “${t.name}”`);
  const m = { i: 0, alts }; S.matches[t.id] = m; saveMatches(); return m;
}
function prefetchNext() {
  const t = S.queue[S.qi + 1];
  if (t && !S.matches[t.id] && S.settings.yt) findMatch(t).catch(() => {});
}

// ---------- CSV import ----------
function parseCSV(s) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (q) { if (c === '"') { if (s[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && s[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
function importCSV(file) {
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const rows = parseCSV(String(rd.result).replace(/^﻿/, ''));
      const h = rows[0].map(x => x.toLowerCase().trim());
      const col = re => h.findIndex(x => re.test(x));
      const iN = col(/^(track name|track title|song name|title|name|song|track)$/), iA = col(/^artist/), iAl = col(/^album( name| title)?$/),
        iD = col(/duration/), iU = col(/^(track uri|spotify - id|spotify id|track id|uri|id)$/), iI = col(/image/);
      if (iN < 0 || iA < 0) throw new Error('Couldn’t find track and artist columns in that file');
      const msHeader = iD >= 0 && /ms/.test(h[iD]);
      const tracks = rows.slice(1).map(r => {
        const name = (r[iN] || '').trim(); if (!name) return null;
        const artists = (r[iA] || '').trim();
        let id = iU >= 0 ? (r[iU] || '').trim().replace(/^spotify:track:/, '') : '';
        if (!/^[A-Za-z0-9]{22}$/.test(id)) id = 'x:' + (name + '|' + artists).toLowerCase();
        let dur = iD >= 0 ? parseFloat(r[iD]) || 0 : 0; if (!msHeader && dur && dur < 7200) dur *= 1000;
        return { id, name, artists, album: iAl >= 0 ? r[iAl] || '' : '', img: iI >= 0 ? r[iI] || '' : '', dur };
      }).filter(Boolean);
      if (!tracks.length) throw new Error('No songs found in that file');
      const base = file.name.replace(/\.csv$/i, '').replace(/[_-]+/g, ' ').trim();
      if (/liked/i.test(base)) {
        const have = new Set(S.lib.liked.map(t => t.id));
        tracks.forEach(t => { if (!have.has(t.id)) S.lib.liked.push(t); });
        toast(`Added ${tracks.length} songs to Liked Songs`);
      } else {
        S.lib.playlists.push({ id: 'csv:' + Date.now(), name: base || 'Imported playlist', img: (tracks.find(t => t.img) || {}).img || '', owner: 'Imported', total: tracks.length, tracks, imported: true });
        toast(`Imported “${base}” · ${tracks.length} songs`);
      }
      saveLib(); render();
    } catch (e) { toast(e.message); }
  };
  rd.readAsText(file);
}

  clearMatches: () => { if (confirm('Forget every YouTube match? Songs will be searched again the next time you play them.')) { S.matches = {}; saveMatches(); render(); toast('Matches reset'); } },
  plMenu: d => { S.panelPl = d.id; openPanel('pl', '<div class="t1">Playlist</div>', mi('rmPl', 'trash', 'Remove imported playlist')); },
  rmPl: () => { S.lib.playlists = S.lib.playlists.filter(p => p.id !== S.panelPl); saveLib(); closePanel(); back(); toast('Playlist removed'); }
};
document.addEventListener('click', e => {
  const link = e.target.closest('a.mi[href]');
  if (link) { // real links so iPhone opens the SoundCloud / Spotify app
    if (link.dataset.fb) S.askFallback = S.panelT;
    if (S.panelT) addRecent(S.panelT);
    setTimeout(closePanel, 200); return;
  }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const f = ACTS[el.dataset.act]; if (!f) return;
  if (el.tagName === 'LABEL') return; // let file picker open
  e.preventDefault(); f(el.dataset);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { S.q = t.value; renderSearchResults(); }
  if (t.id === 'seek') {
    S.seeking = true; t.style.setProperty('--p', t.value / 10 + '%');
    if (S.ytReady && S.vid) $('#tCur').textContent = fmt(t.value / 1000 * S.yt.getDuration() * 1000);
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'cid') { S.settings.cid = t.value.trim(); LS.set('settings', S.settings); toast('Client ID saved'); }
  if (t.id === 'ytkey') { S.settings.yt = t.value.trim(); LS.set('settings', S.settings); toast('YouTube key saved'); }
  if (t.id === 'csv' && t.files && t.files[0]) { importCSV(t.files[0]); t.value = ''; }
  if (t.id === 'seek') { if (S.ytReady && S.vid) S.yt.seekTo(t.value / 1000 * S.yt.getDuration(), true); S.seeking = false; }
});
window.addEventListener('resize', placePlayer);
window.addEventListener('orientationchange', () => setTimeout(placePlayer, 300));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  if (e.key === 'Escape') { if (S.panelKind) closePanel(); else closeNP(); }
});

// progress ticker
setInterval(() => {
  if (!S.ytReady || !S.vid || !S.yt.getCurrentTime) return;
  let c = 0, d = 0; try { c = S.yt.getCurrentTime() || 0; d = S.yt.getDuration() || 0; } catch (e) { return; }
  const p = d ? c / d : 0;
  if (!S.seeking) { const sk = $('#seek'); sk.value = Math.round(p * 1000); sk.style.setProperty('--p', p * 100 + '%'); $('#tCur').textContent = fmt(c * 1000); if (d) $('#tDur').textContent = fmt(d * 1000); }
  $('#miniBar').style.width = p * 100 + '%';
  if (!S.prefetched && c > 15) { S.prefetched = true; prefetchNext(); }
}, 500);

// ---------- boot ----------
$('#tab-home').innerHTML = ic('lib') + 'Library';
$('#tab-search').innerHTML = ic('search') + 'Search';
$('#tab-settings').innerHTML = ic('gear') + 'Settings';
$('#npClose').innerHTML = ic('down'); $('#npMore').innerHTML = ic('more');
$('#bShuf').innerHTML = ic('shuffle'); $('#bPrev').innerHTML = ic('prev'); $('#bNext').innerHTML = ic('next');
$('#bFix').innerHTML = ic('swap') + 'Wrong song?'; $('#bQueue').innerHTML = ic('list') + 'Up next';
render(); renderNow();
handleRedirect();

</script>
<script src="https://www.youtube.com/iframe_api" async></script>
</body>
</html>
